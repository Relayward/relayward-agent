name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: shellcheck deploy/install.sh deploy/uninstall.sh deploy/relayward-agent-launcher deploy/relayward-agent.openrc scripts/build-release.sh
      - run: ./scripts/build-release.sh v0.0.0-ci /tmp/relayward-agent-release
      - run: cd /tmp/relayward-agent-release && sha256sum -c SHA256SUMS
      - name: Test systemd and OpenRC installation
        env:
          RELAYWARD_AGENT_INSTALL_INTEGRATION: "1"
          RELAYWARD_AGENT_RELEASE_DIR: /tmp/relayward-agent-release
          RELAYWARD_AGENT_RELEASE_VERSION: 0.0.0-ci
        run: go test ./integration -count=1
