name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache: true
      - name: Verify
        run: |
          go test ./...
          go vet ./...
          shellcheck deploy/install.sh deploy/uninstall.sh deploy/relayward-agent-launcher deploy/relayward-agent.openrc scripts/build-release.sh
      - name: Build Linux AMD64 release
        run: ./scripts/build-release.sh "${GITHUB_REF_NAME}" dist
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/install.sh
            dist/relayward-agent-linux-amd64
            dist/relayward-agent-linux-amd64.tar.gz
            dist/relayward-agent-manifest.json
            dist/SHA256SUMS
